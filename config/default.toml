# Конфигурация bomboec. Шаблон по умолчанию: config/default.toml в исходниках, bomboec.exe
# создаёт из него bomboec.toml рядом с exe при первом запуске.

[format]
sample_rate = 48000
frame_ms = 10
mic_channels = 1
reference_channels = 2

# Устройства выбираются в меню трея и хранятся в bomboec.state.toml рядом с exe. Этот конфиг
# приложение не переписывает. Вручную устройства можно задать секцией [devices] здесь:
#   [devices]
#   mic = "{0.0.1.00000000}.{...}"   # endpoint id; пусто = устройство по умолчанию
#   speakers = ""                    # render endpoint для loopback (reference); необязателен
#   output = ""                      # render endpoint для очищенного сигнала (virtual cable)
#   mic_name = ""                    # имена (mic_name, speakers_name, output_name): запасной
#                                    # поиск, если id сменился
# Ключи [devices] из bomboec.state.toml, если он есть, перекрывают одноимённые ключи отсюда.

[engine]
mic_raw = true
reference_lead_ms = 5   # reference раньше кадра mic; больше задержки динамик -> микрофон нельзя (см. README)
output_buffer_ms = 10   # запас в выходном кольце (джиттер микрофона)
output_render_ms = 20   # заполнение буфера WASAPI выхода, не меньше 2 периодов
output_channels = 2
record_dir = ""
on_demand = true        # микрофон занят, только пока кто-то пишет с микрофона кабеля (сессии на нём)
idle_stop_sec = 5       # через сколько секунд без слушателей отпустить микрофон

# Цепочка стадий выполняется по порядку. Каждая возможность (hpf, aec, ns, agc,
# limiter) может быть объявлена только одной стадией.

# Свой фильтр высоких частот перед AEC3. Ключ hpf стадии webrtc здесь не поможет: APM всё равно
# включает свой HPF, пока работает AEC (enforce_high_pass_filtering), поэтому hpf = true и
# hpf = false дают побитово одинаковый выход. Отдельная стадия режет гул стола и стойки до
# AEC3, и тот сходится лучше: эхо на take1 33.7 -> 36.1 dB, музыка 45.3 -> 50.5, удары 9.4 ->
# 12.4, спектральное расстояние на чистой речи 6.8 -> 5.1 dB (docs/research/2026-09-12-ns-quality.md).
# Выше 100 Hz срезает уже основной тон голоса: на 120 Hz смеси с эхом портятся.
[[chain]]
id = "hpf"
cutoff_hz = 90.0

[[chain]]
id = "webrtc"
aec = true
hpf = false           # см. стадию hpf выше: ключ APM ничего не меняет при aec = true
ns = false            # NS из WebRTC: low | moderate | high | very_high; вместо него ниже rnnoise
ns_level = "high"
agc = false
filter_length_blocks = 13
delay_num_filters = 5
# Подавитель AEC3 в double-talk. Штатная настройка давит голос вместе с эхом: на смеси речи с
# музыкой на том же уровне спектральное расстояние 19.8 dB и 35 % кадров речи проседают. Более
# прозрачные пороги nearend_* плюс более отзывчивый детектор "говорит человек" дают 13.9 dB и
# 24 %, а подавление эха без речи не страдает (музыка 50.5 dB). enr_threshold выше 0.5 трогать
# нельзя: детектор начинает считать ближним голосом само эхо (музыка падает до 35 dB).
nearend_mask_lf_transparent = 5.0
nearend_mask_lf_suppress = 5.1
nearend_mask_hf_transparent = 1.5
nearend_mask_hf_suppress = 3.0
nearend_enr_threshold = 0.35
nearend_trigger_threshold = 3
nearend_hold_duration = 100

# Гейт ударов и щелчков (стадия transient): на корпусе стуков поднимает подавление удара с 12.4
# до 31.8 dB, а самый громкий остаток с -11.3 до -29.9 dBFS. Выключен, потому что стоит 4 ms
# задержки и на речи поверх удара гасит 60 ms голоса: доля просевших кадров на смеси речь+стуки
# 12.9 -> 23.4 % против той же цепочки с одной лишь задержкой. Проверка гармоничности
# (harmonicity_max) убрала ложные срабатывания на живой речи: на прежнем шаблоне доля просевших
# кадров call-alone 11.0 -> 4.7 % при 4.3 % у цепочки с той же задержкой и без гейта.
#   [[chain]]
#   id = "transient"
#   rise_db_per_ms = 20.0   # скачок огибающей за 1 ms; речь до 15-20, удары 25-45
#   level_dbfs = -30.0
#   depth_db = 20.0
#   hold_ms = 60.0
#   release_ms = 100.0
#   harmonicity_max = 0.4   # атаки с тоном (речь) не гасить; 1.0 = проверка выключена
#   lookahead_ms = 4.0      # задержка стадии: без неё harmonicity_max не работает

# Шумоподавление на RNNoise: клавиатуру и щелчки давит на 18 dB против 5 dB у NS WebRTC.
# input_gain_db меняет только рабочую точку сети (уровень на выходе стадии тот же): -6 dB делает
# её мягче (спектральное расстояние на чистой речи 5.1 -> 5.0 dB), но забирает 2 dB подавления
# клавиатуры и 3 dB подавления ударов, поэтому 0.
[[chain]]
id = "rnnoise"
input_gain_db = 0.0

[[chain]]
id = "limiter"
ceiling_db = -1.0
release_ms = 50.0
