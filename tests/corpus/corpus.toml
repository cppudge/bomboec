# Корпус эталонных записей для регрессии (tests/test_corpus.cpp, тег [corpus]).
#
# Записи лежат вне git: root задаёт каталог относительно этого файла, dir сценария относительно
# root. Каждый сценарий: mic.wav (микрофон, raw), ref.wav (loopback колонок), metadata.json из
# bomboec-rec (scripts/record-corpus.ps1 записывает весь корпус по протоколу с подсказками).
#
# Сегменты (секунды от начала записи) и что на них проверяется:
#   echo         музыка в колонках, человек молчит: подавление mic -> out >= echo_min_db
#   double_talk  музыка и речь одновременно: подавление >= double_talk_min_db
#   speech       только речь: потеря уровня <= speech_max_loss_db
#   silence      никто не говорит, музыки нет: выход тише входа >= quiet_min_reduction_db
#   noise        бытовой шум без музыки (клавиатура, вентилятор): как silence
#   transients   стуки и щелчки без речи и музыки: медиана подавления по событиям (пик
#                микрофона минус пик выхода на кадрах громче шумового пола на transient_event_db)
#                >= transient_min_db; в отчёте число событий и самый громкий остаток на выходе
# На каждом сегменте: всплески (RMS 100 ms) на выходе не выше входа + burst_max_db.
# Смеси [[mix]]: чистая речь (speech) плюс шум (noise, noise_gain_db) и/или эхо (echo: mic.wav
# и ref.wav сценария с музыкой); выход сравнивается с чистой речью на её кадрах: спектральное
# расстояние в 24 полосах <= mix_speech_lsd_max_db, доля кадров, просевших > 6 dB против
# медианы, <= mix_dip_max; на кадрах без речи подавление >= mix_noise_min_db. baseline =
# [lsd, dips, noise]. Так ловится порча голоса, которую RMS речи не показывает.
# baseline: подавление по сегментам (dB, в том же порядке) с прошлого прогона; ухудшение
# больше regression_tolerance_db - ошибка. Обновить: BOMBOEC_CORPUS_BASELINE=1 bomboec_tests "[corpus]".

root = "../../recordings"
# config = "..."   # TOML цепочки вместо встроенного config/default.toml

[thresholds]
echo_min_db = 10.0
double_talk_min_db = 1.5   # речь громче эха: общее подавление ограничено долей эха в сигнале.
                           # С прозрачным подавителем AEC3 (config/default.toml) на double-talk
                           # намеренно остаётся больше голоса, и с ним эха: 2.1 dB против 2.4.
                           # Само подавление эха стерегут сегменты echo, где речи нет.
speech_max_loss_db = 4.0   # NS давит паузы между словами: RMS речи падает на 2-3 dB и без потери голоса
quiet_min_reduction_db = 4.0
burst_max_db = 6.0
transient_min_db = 6.0     # шаблон без стадии transient: 12.4 dB; с ней 31.8
transient_event_db = 15.0
mix_speech_lsd_max_db = 18.0  # эхо на уровне речи даёт 13.9: AEC3 давит голос в double-talk
mix_dip_max = 0.3
mix_noise_min_db = 6.0
regression_tolerance_db = 1.5
guard_sec = 0.3

# Протокол этапа 3 (2026-09-11): 10 с музыка, 10 с музыка + речь, 10 с речь.
[[scenario]]
name = "take1"
dir = "take1"
segments = [
    { type = "echo", from = 0.0, to = 10.0 },
    { type = "double_talk", from = 10.0, to = 20.0 },
    { type = "speech", from = 20.0, to = 30.0 },
]
baseline = [36.1, 3.1, 2.4]   # 2026-09-12, hpf 90 Hz + AEC3 + rnnoise, lead 5 ms

# Сценарии scripts/record-corpus.ps1 (recordings/corpus/<name>).
# Записаны 2026-09-12 (Yeti Orb, Sound Blaster Z, шум bomboec-play --noise на -14 dB); baseline с rnnoise.
[[scenario]]
name = "silence"
dir = "corpus/silence"
segments = [{ type = "silence", from = 0.0, to = 20.0 }]
baseline = [39.2]

[[scenario]]
name = "noise"
dir = "corpus/noise"
segments = [{ type = "noise", from = 0.0, to = 20.0 }]
baseline = [18.8]   # 27.3 со стадией transient

[[scenario]]
name = "music"
dir = "corpus/music"
segments = [{ type = "echo", from = 1.0, to = 30.0 }]
baseline = [50.5]

[[scenario]]
name = "speech"
dir = "corpus/speech"
segments = [{ type = "speech", from = 0.0, to = 30.0 }]
baseline = [1.6]

[[scenario]]
name = "music-speech"
dir = "corpus/music-speech"
segments = [{ type = "double_talk", from = 1.0, to = 30.0 }]
baseline = [2.1]

# Живая громкая речь, как в звонке (2026-09-12): пик -6 dBFS против -8.6 у чтения.
[[scenario]]
name = "speech-call"
dir = "corpus/speech-call"
segments = [{ type = "speech", from = 0.0, to = 30.0 }]
baseline = [1.1]

# Стуки по столу, щелчки, кружка, стойка микрофона; без речи и музыки. Baseline после записи.
[[scenario]]
name = "transients"
dir = "corpus/transients"
segments = [{ type = "transients", from = 0.0, to = 20.0 }]
# 2026-09-12: без гейта 12.4 (остаток до -11.3 dBFS); со стадией transient 31.8 (остаток -29.9).
baseline = [12.4]

# Смеси из тех же записей (2026-09-12, шаблон hpf 90 Hz + AEC3 + rnnoise). Сама цепочка на чистой
# речи: lsd 5.1, провалы 8.9 % (тихие согласные); помеха добавляет к этому 2-4 dB lsd, эхо на
# уровне речи 9 dB (было 15 до настройки подавителя AEC3, см. docs/research/2026-09-12-ns-quality.md).
[[mix]]
name = "speech-alone"
speech = "corpus/speech"
baseline = [5.1, 0.089, 16.0]

[[mix]]
name = "speech+keyboard"
speech = "corpus/speech"
noise = "corpus/noise"
baseline = [7.8, 0.118, 24.5]

[[mix]]
name = "speech+knocks"
speech = "corpus/speech"
noise = "corpus/transients"
baseline = [8.8, 0.121, 24.0]

[[mix]]
name = "speech+music-echo"
speech = "corpus/speech"
echo = "corpus/music"
baseline = [13.9, 0.241, 29.9]

# Колонки тише: эхо на 10 dB ниже речи, ближе к разговору при умеренной громкости.
[[mix]]
name = "speech+music-echo-10"
speech = "corpus/speech"
echo = "corpus/music"
echo_gain_db = -10.0
baseline = [7.5, 0.108, 26.3]

# Те же смеси на живой речи (speech-call, пик -6 dBFS): громкий голос цепочка портит меньше
# (lsd 3.5 против 5.1 на тихом чтении). Гейт transient без проверки гармоничности срабатывал на
# нём сам по себе (провалы 3.9 % -> 11 % без всякой помехи), что и слышал пользователь.
[[mix]]
name = "call-alone"
speech = "corpus/speech-call"
baseline = [3.5, 0.039, 12.9]

[[mix]]
name = "call+keyboard"
speech = "corpus/speech-call"
noise = "corpus/noise"
baseline = [5.0, 0.044, 23.1]

[[mix]]
name = "call+knocks"
speech = "corpus/speech-call"
noise = "corpus/transients"
baseline = [5.5, 0.05, 29.3]

[[mix]]
name = "call+music-echo-10"
speech = "corpus/speech-call"
echo = "corpus/music"
echo_gain_db = -10.0
baseline = [5.9, 0.06, 22.8]
